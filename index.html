<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006C35">
  <title>المصوّر الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>المصوّر الذكي</h1>
    <p class="sub">صورة الأحوال المدنية</p>
  </header>

  <main class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <div class="start" id="start">
      <p>خلّ وجهك داخل الإطار، وأنا أوجّهك خطوة خطوة</p>
      <button id="startBtn" type="button" disabled>جاري التحميل…</button>
    </div>
  </main>

  <footer class="bottom">
    <p class="msg" id="msg" role="status" aria-live="polite">&nbsp;</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
